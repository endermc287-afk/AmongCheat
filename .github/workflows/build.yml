
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find Android Project
        id: project
        run: |
          echo "Repository files:"
          find . -maxdepth 5 -type f | head -200

          WRAPPER=$(find . -type f -name gradlew | head -n 1)

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "type=wrapper" >> "$GITHUB_OUTPUT"
          else
            GRADLE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
            if [ -z "$GRADLE" ]; then
              echo "No Gradle project found!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GRADLE")
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "type=system" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ "${{ steps.project.outputs.type }}" = "wrapper" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmongCheat-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
