
name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -q amongushile.zip -d project
          echo "ZIP extracted:"
          find project -maxdepth 4 -type f | head -150

      - name: Find Gradle Project
        id: locate
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: ZIP içinde gradlew bulunamadı."
            find project -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        if: success()
        run: |
          mkdir -p artifacts
          find project -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmongCheat-APK
          path: artifacts/*.apk
          if-no-files-found: error
